name: Prepare release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that triggers PR checks
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo 'Configure RELEASE_PLEASE_TOKEN before enabling release PRs.' >&2
            exit 1
          fi

      - name: Prepare changelog and version PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find the open release PR, including unchanged PRs on reruns
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr list --state open --base main \
            --head release-please--branches--main--components--colors-for-folders-files-and-tabs --label 'autorelease: pending' \
            --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)] | if length > 1 then error("Multiple release PRs found") elif length == 1 then .[0].headRefName else "" end')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check out the release PR
        if: steps.release-pr.outputs.branch != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Use pinned tools
        if: steps.release-pr.outputs.branch != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.11

      - name: Install frozen dependencies
        if: steps.release-pr.outputs.branch != ''
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Synchronize and format release metadata
        if: steps.release-pr.outputs.branch != ''
        run: |
          release_version=$(mise exec -- node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          npm_package_version="$release_version" mise exec -- node version-bump.mjs
          mise exec -- pnpm exec prettier --write package.json manifest.json versions.json .release-please-manifest.json CHANGELOG.md
          mise exec -- pnpm run check:release

      - name: Update the release PR
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git add package.json manifest.json versions.json .release-please-manifest.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: synchronize release metadata'
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
